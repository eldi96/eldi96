<svg width="1200" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="mist" x="-30%" y="-350%" width="180%" height="800%">
    <feGaussianBlur stdDeviation="32"/>
  </filter>
  <linearGradient id="trail" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#2563EB" stop-opacity=".30"/>
    <stop offset=".14" stop-color="#22D3EE" stop-opacity=".23"/>
    <stop offset=".45" stop-color="#0EA5E9" stop-opacity=".13"/>
    <stop offset=".75" stop-color="#2563EB" stop-opacity=".07"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- animated mist only; text stays static so GitHub always shows it -->
<ellipse cx="470" cy="58" rx="700" ry="18" fill="url(#trail)" filter="url(#mist)">
  <animate attributeName="cx" values="430;510;430" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".72;1;.72" dur="7s" repeatCount="indefinite"/>
</ellipse>

<!-- SVG path version of ELDI-like wordmark fallback via plain text with no animation -->
<text x="18" y="74"
      fill="#F0F9FF"
      font-family="Arial, Helvetica, sans-serif"
      font-size="52"
      font-weight="700"
      letter-spacing="3">ELDI</text>

<rect x="19" y="88" width="116" height="2" rx="1" fill="#7DD3FC" fill-opacity=".75"/>
<circle cx="143" cy="89" r="2.4" fill="#CFFAFE"/>
</svg>