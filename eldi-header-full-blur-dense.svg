<svg width="1200" height="150" viewBox="0 0 1200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="soft" x="-8%" y="-80%" width="116%" height="260%">
    <feGaussianBlur stdDeviation="26"/>
  </filter>
  <filter id="deep" x="-12%" y="-120%" width="124%" height="340%">
    <feGaussianBlur stdDeviation="38"/>
  </filter>

  <linearGradient id="base" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#1D4ED8" stop-opacity=".62"/>
    <stop offset=".16" stop-color="#0891B2" stop-opacity=".52"/>
    <stop offset=".42" stop-color="#0EA5E9" stop-opacity=".40"/>
    <stop offset=".72" stop-color="#2563EB" stop-opacity=".32"/>
    <stop offset="1" stop-color="#06B6D4" stop-opacity=".28"/>
  </linearGradient>

  <linearGradient id="highlight" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#60A5FA" stop-opacity=".48"/>
    <stop offset=".25" stop-color="#22D3EE" stop-opacity=".34"/>
    <stop offset=".65" stop-color="#38BDF8" stop-opacity=".24"/>
    <stop offset="1" stop-color="#60A5FA" stop-opacity=".20"/>
  </linearGradient>

  <linearGradient id="text" x1="24" y1="0" x2="185" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF"/>
    <stop offset=".62" stop-color="#F0F9FF"/>
    <stop offset="1" stop-color="#BAE6FD"/>
  </linearGradient>
</defs>

<!-- broad full-width atmospheric glow -->
<rect x="-25" y="22" width="1250" height="106" rx="45"
      fill="url(#base)" filter="url(#deep)"/>

<!-- brighter full-width core -->
<rect x="-10" y="43" width="1220" height="66" rx="30"
      fill="url(#highlight)" filter="url(#soft)"/>

<!-- local intensity behind ELDI -->
<ellipse cx="112" cy="74" rx="125" ry="52"
         fill="#38BDF8" fill-opacity=".42" filter="url(#soft)"/>

<text x="24" y="91"
      fill="url(#text)"
      font-family="Arial, Helvetica, sans-serif"
      font-size="56"
      font-weight="700"
      letter-spacing="3">ELDI</text>

<rect x="25" y="106" width="116" height="2" rx="1"
      fill="#7DD3FC" fill-opacity=".9"/>
<circle cx="149" cy="107" r="2.6" fill="#CFFAFE"/>
</svg>